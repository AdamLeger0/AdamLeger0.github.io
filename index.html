<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Leger - Portfolio</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Standalone for browser) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #fdfde6; overflow: hidden; }
        
        /* 3D Flip Animations */
        @keyframes flipIn {
          0% { transform: rotateX(-90deg) scale(0.9); opacity: 0; }
          100% { transform: rotateX(0deg) scale(1); opacity: 1; }
        }
        @keyframes flipOut {
          0% { transform: rotateX(0deg) scale(1); opacity: 1; }
          100% { transform: rotateX(90deg) scale(0.9); opacity: 0; }
        }
        .cube-in {
          animation: flipIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
          opacity: 0; 
        }
        .cube-out {
          animation: flipOut 0.25s cubic-bezier(0.5, 0, 0.8, 0.5) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Strict Color Palette
        const COLORS = {
            cream: '#fdfde6',
            yellow: '#ffc857',
            orange: '#e9724c',
            red: '#c5283d',
            maroon: '#481d24',
            blue: '#255f85',
        };

        // Icon paths (Native SVGs so it works without NPM)
        const ICONS = {
            User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
            Briefcase: <><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></>,
            Music: <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,
            FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>,
            Phone: <><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></>,
            ArrowLeft: <><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
            ChevronRight: <><polyline points="9 18 15 12 9 6"/></>,
            ChevronLeft: <><polyline points="15 18 9 12 15 6"/></>,
            GraduationCap: <><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></>,
            Globe: <><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>,
            Book: <><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></>,
            Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            Building: <><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></>,
            Mail: <><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></>,
            Calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
            Monitor: <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
            Rocket: <><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></>,
            HeartPulse: <><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></>,
            Wind: <><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></>,
            ScrollText: <><path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M15 8h-5"/><path d="M15 12h-5"/></>,
            Mic: <><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></>,
        };

        const IconRenderer = ({ name, size = 24, className = '', strokeWidth = 2 }) => {
            const paths = ICONS[name] || ICONS.Book;
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth={strokeWidth} 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {paths}
                </svg>
            );
        };

        // ==========================================
        // PORTFOLIO DATA (Static Dictionary)
        // Edit this directly for your content!
        // ==========================================
        const PORTFOLIO_DATA = {
            main: {
                isCustomLayout: true,
                items: [
                    { id: 'about', title: 'Adam Leger', subtitle: 'Political Scientist', icon: 'User', bg: COLORS.blue, text: COLORS.cream, action: 'about', span: 'col-span-2 row-span-2 md:col-span-2 md:row-span-2' },
                    { id: 'employment', title: 'Employment', subtitle: 'Work History', icon: 'Briefcase', bg: COLORS.maroon, text: COLORS.cream, action: 'employment', span: 'col-span-2 row-span-1 md:col-span-2 md:row-span-1' },
                    { id: 'music', title: 'Music', subtitle: 'Current Works', icon: 'Music', bg: COLORS.yellow, text: COLORS.maroon, action: 'music', span: 'col-span-1 row-span-1 md:col-span-1 md:row-span-1' },
                    { id: 'papers', title: 'Papers', subtitle: 'Current Works', icon: 'FileText', bg: COLORS.orange, text: COLORS.maroon, action: 'papers', span: 'col-span-1 row-span-1 md:col-span-1 md:row-span-1' },
                    { id: 'contact', title: 'Contact', subtitle: 'Reach out', icon: 'Phone', bg: COLORS.red, text: COLORS.cream, action: 'contact', span: 'col-span-2 row-span-2 md:col-span-4 md:row-span-1' }
                ]
            },
            about: {
                title: 'About Me', subtitle: 'Political Scientist', icon: 'User', bg: COLORS.blue, text: COLORS.cream,
                items: [
                    { id: 'a1', title: 'Winthrop University', subtitle: 'MA Student in Political Science. Focused on international political theory.', icon: 'GraduationCap', bg: COLORS.maroon, text: COLORS.cream },
                    { id: 'a2', title: 'Future Goals', subtitle: 'Planning to pursue a PhD at OSU to further research into structural political orders.', icon: 'Globe', bg: COLORS.orange, text: COLORS.maroon },
                    { id: 'a3', title: 'Focus Areas', subtitle: 'Anarchy in international systems, marginalized community impacts, and political theory.', icon: 'Book', bg: COLORS.red, text: COLORS.cream }
                ]
            },
            employment: {
                title: 'Employment', subtitle: 'History & Leadership', icon: 'Briefcase', bg: COLORS.maroon, text: COLORS.cream,
                items: [
                    { id: 'e1', title: 'Graduate Assistant', subtitle: 'School of Graduate, Online, and Continuing Education (Winthrop).', icon: 'Building', bg: COLORS.blue, text: COLORS.cream },
                    { id: 'e2', title: 'Leadership Operations', subtitle: 'WUMUN (Winthrop University Model United Nations).', icon: 'Users', bg: COLORS.orange, text: COLORS.maroon },
                ]
            },
            papers: {
                title: 'Papers', subtitle: 'Research & Publications', icon: 'FileText', bg: COLORS.orange, text: COLORS.maroon,
                items: [
                    { id: 'p1', title: 'The Blackest Sea', subtitle: "Stellar Politiks and Humanity's Reach to the Stars (Master's Thesis)", icon: 'Rocket', bg: COLORS.blue, text: COLORS.cream },
                    { id: 'p2', title: 'Rings of Ruin', subtitle: 'The Social Contract and the Application of Anarchy within International Political Theory (Post 1945 order).', icon: 'Globe', bg: COLORS.maroon, text: COLORS.cream },
                    { id: 'p3', title: 'Combating Ebola', subtitle: 'And Its Disproportionate Impact on Marginalized Communities.', icon: 'HeartPulse', bg: COLORS.red, text: COLORS.cream },
                    { id: 'p4', title: 'Natural Disasters', subtitle: 'Preventing Natural Disaster Driven Displacement.', icon: 'Wind', bg: COLORS.yellow, text: COLORS.maroon },
                    { id: 'p5', title: 'Earlier Works', subtitle: 'Various undergraduate essays exploring structured political orders.', icon: 'ScrollText', bg: COLORS.maroon, text: COLORS.cream }
                ]
            },
            music: {
                title: 'Music', subtitle: 'Compositions & Performances', icon: 'Music', bg: COLORS.yellow, text: COLORS.maroon,
                items: [
                    { id: 'm1', title: 'Tuba Performances', subtitle: 'Low brass specialist and ensemble performances.', icon: 'Mic', bg: COLORS.red, text: COLORS.cream },
                    { id: 'm2', title: 'Original Compositions', subtitle: 'Arrangements and original works for bands and orchestras.', icon: 'Book', bg: COLORS.blue, text: COLORS.cream },
                ]
            },
            contact: {
                title: 'Contact', subtitle: 'Get in touch', icon: 'Phone', bg: COLORS.red, text: COLORS.cream,
                items: [
                    { id: 'c1', title: 'Grad Email', subtitle: 'leger@winthrop.edu', icon: 'Mail', bg: COLORS.blue, text: COLORS.cream },
                    { id: 'c2', title: 'SGOC Office', subtitle: 'Contact for continuing education inquiries.', icon: 'Building', bg: COLORS.orange, text: COLORS.maroon },
                    { id: 'c3', title: 'In-Person Appt', subtitle: 'Schedule a 30-minute meeting on campus.', icon: 'Calendar', bg: COLORS.maroon, text: COLORS.cream },
                    { id: 'c4', title: 'Online/Phone Appt', subtitle: 'Schedule a virtual 30-minute meeting.', icon: 'Monitor', bg: COLORS.yellow, text: COLORS.maroon },
                ]
            }
        };

        // Data fetching layer
        function getSectionData(sectionId) {
            return PORTFOLIO_DATA[sectionId] || null;
        }

        // Deterministic Pagination Engine 
        function buildPages(items) {
            const pages = [];
            let remaining = [...items];
            
            while (remaining.length > 0) {
                let isFirstPage = pages.length === 0;
                let pageSlots = 4; // Max slots available
                let pageItems = [];
                
                if (!isFirstPage) {
                    pageItems.push({ id: `prev-${pages.length}`, title: 'Previous', icon: 'ChevronLeft', bg: COLORS.yellow, text: COLORS.maroon, pageAction: -1 });
                    pageSlots--;
                }
                
                let takeCount = remaining.length > pageSlots ? pageSlots - 1 : remaining.length;
                pageItems.push(...remaining.splice(0, takeCount));
                
                if (remaining.length > 0) {
                    pageItems.push({ id: `next-${pages.length}`, title: 'More Items', icon: 'ChevronRight', bg: COLORS.yellow, text: COLORS.maroon, pageAction: 1 });
                }
                
                pages.push(pageItems);
            }
            return pages;
        }

        const Cube = ({ item, isExiting, index, onNavigate, onPageChange }) => {
            const isInteractive = Boolean(item.action) || Boolean(item.pageAction);

            const handleClick = () => {
                if (item.action) onNavigate(item.action);
                else if (item.pageAction) onPageChange(item.pageAction);
            };

            return (
                <div
                    onClick={handleClick}
                    className={`
                        relative flex flex-col justify-between p-4 md:p-5 rounded-none overflow-hidden
                        ${item.span}
                        ${isInteractive ? 'cursor-pointer hover:brightness-110 active:scale-[0.97]' : ''}
                        ${item.isDecorative ? 'opacity-90' : ''}
                        ${isExiting ? 'cube-out' : 'cube-in'}
                        transition-all duration-200 transform-gpu
                    `}
                    style={{ 
                        backgroundColor: item.bg, 
                        color: item.text,
                        animationDelay: isExiting ? '0s' : `${index * 0.04}s`,
                        outline: `1px solid ${COLORS.cream}20`,
                        outlineOffset: '-1px'
                    }}
                >
                    {/* Large Watermark Icon */}
                    {!item.isDecorative && (
                        <div className="absolute -bottom-6 -right-6 md:-bottom-8 md:-right-8 opacity-15 pointer-events-none">
                            <IconRenderer name={item.icon} size={160} strokeWidth={1.5} />
                        </div>
                    )}
                    
                    <div className="relative z-10 flex flex-col justify-between h-full w-full min-h-0">
                        <div className="self-end">
                            <IconRenderer name={item.icon} size={28} className="opacity-90" strokeWidth={2} />
                        </div>
                        
                        {!item.isDecorative && (
                        <div className="self-start text-left mt-auto w-full">
                            <h3 className={`font-bold leading-tight tracking-tight uppercase break-words ${item.isHeader ? 'text-2xl md:text-4xl mb-2' : 'text-sm sm:text-base md:text-2xl mb-1'}`}>
                            {item.title}
                            </h3>
                            {item.subtitle && (
                            <p className={`font-semibold opacity-85 leading-snug line-clamp-4 uppercase tracking-wide ${item.isHeader ? 'text-sm md:text-lg' : 'text-[10px] sm:text-xs md:text-sm'}`}>
                                {item.subtitle}
                            </p>
                            )}
                        </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentSection, setCurrentSection] = useState('main');
            const [currentPage, setCurrentPage] = useState(0);
            const [isExiting, setIsExiting] = useState(false);
            const [sectionData, setSectionData] = useState(null);

            useEffect(() => {
                setSectionData(getSectionData('main'));
            }, []);

            const handleNavigate = (targetSection) => {
                if (isExiting || targetSection === currentSection) return;
                setIsExiting(true);
                
                setTimeout(() => {
                    setCurrentSection(targetSection);
                    setCurrentPage(0);
                    setSectionData(getSectionData(targetSection));
                    setIsExiting(false);
                }, 300);
            };

            const handlePageChange = (direction) => {
                if (isExiting) return;
                setIsExiting(true);
                setTimeout(() => {
                    setCurrentPage(prev => prev + direction);
                    setIsExiting(false);
                }, 300);
            };

            if (!sectionData) return null;

            let renderItems = [];

            if (sectionData.isCustomLayout) {
                renderItems = sectionData.items;
            } else {
                const headerItems = [
                    { id: 'back', title: 'BACK', icon: 'ArrowLeft', bg: COLORS.yellow, text: COLORS.maroon, action: 'main', span: 'col-span-1 row-span-1 md:col-span-1 md:row-span-1' },
                    { id: 'dec', icon: sectionData.icon, bg: sectionData.bg, text: sectionData.text, span: 'col-span-1 row-span-1 md:hidden', isDecorative: true },
                    { id: 'title', title: sectionData.title, subtitle: sectionData.subtitle, icon: sectionData.icon, bg: sectionData.bg, text: sectionData.text, span: 'col-span-2 row-span-1 md:col-span-3 md:row-span-1', isHeader: true }
                ];

                const pages = buildPages(sectionData.items);
                const currentItems = pages[currentPage] || [];
                
                const mappedItems = currentItems.map(item => ({
                ...item,
                span: 'col-span-2 row-span-1 md:col-span-2 md:row-span-1'
                }));

                renderItems = [...headerItems, ...mappedItems];
            }

            return (
                <div className="h-screen w-screen p-2 md:p-4 box-border flex flex-col items-center justify-center">
                    <div 
                        className="w-full max-w-7xl h-full grid grid-cols-2 md:grid-cols-4 grid-rows-6 md:grid-rows-3 gap-0"
                        style={{ perspective: '2000px' }}
                    >
                        {renderItems.map((item, idx) => (
                            <Cube 
                                key={`${currentSection}-p${currentPage}-${item.id}`} 
                                item={item} 
                                index={idx}
                                isExiting={isExiting}
                                onNavigate={handleNavigate}
                                onPageChange={handlePageChange}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
